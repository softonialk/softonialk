  @keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spread{from{opacity:0;letter-spacing:16px}to{opacity:1;letter-spacing:4px}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes draw{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
</style>
